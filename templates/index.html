
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Secure Login | Mail Console</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 15% 10%, #263b70 0, transparent 38%),
                radial-gradient(circle at 90% 90%, #452268 0, transparent 35%),
                #090f1e;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px 30px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            background: rgba(18, 27, 48, 0.96);
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #6366f1, #9333ea);
            font-size: 30px;
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #aab5ca;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            margin-bottom: 20px;
            padding: 13px 15px;
            border: 1px solid rgba(248,113,113,0.35);
            border-radius: 10px;
            background: rgba(127,29,29,0.22);
            color: #fca5a5;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #e0e7f5;
            font-size: 14px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 65px 15px 15px;
            border: 1px solid #35415c;
            border-radius: 11px;
            outline: none;
            background: #0e1729;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
        }

        input::placeholder {
            color: #78849d;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #aab5ca;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .login-button {
            width: 100%;
            margin-top: 23px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #6366f1, #9333ea);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .login-button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            margin-top: 27px;
            color: #8490a8;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo" aria-hidden="true">🔐</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to access your Secure Mail Console.
        </p>

        {% if error %}
            <div class="error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="password">Login Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    autofocus
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                >
                    Show
                </button>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign In
            </button>

        </form>

        <div class="footer">
            Protected Login · Secure Mail Console
        </div>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.querySelector("form");
        const loginButton = document.getElementById("loginButton");

        togglePassword.addEventListener("click", function () {
            const hidden = passwordInput.type === "password";

            passwordInput.type = hidden ? "text" : "password";
            togglePassword.textContent = hidden ? "Hide" : "Show";

            togglePassword.setAttribute(
                "aria-label",
                hidden ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", function () {
            if (!loginForm.checkValidity()) {
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
        });
    </script>

</body>
</html>
